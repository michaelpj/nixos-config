# Starship prompt - lean style
format = """
$directory\
$haskell\
${custom.git_branch}\
${custom.git_status}\
${custom.jj}\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$direnv\
$username\
$hostname"""

add_newline = false

# Wrap git modules to only show outside jj repos
[git_branch]
disabled = true

[custom.git_branch]
when = "! jj --ignore-working-copy root 2>/dev/null"
command = "starship module git_branch"
style = ""
format = "$output"

[git_status]
disabled = true

[custom.git_status]
when = "! jj --ignore-working-copy root 2>/dev/null"
command = "starship module git_status"
style = ""
format = "$output"

# jj status - similar format to git
[custom.jj]
command = '''
jj log -r @ -n1 --ignore-working-copy --no-graph --color always -T '
  concat(
    change_id.shortest(4),
    if(conflict, concat(raw_escape_sequence("\x1b[31m"), "~", raw_escape_sequence("\x1b[0m"))),
    if(divergent, concat(raw_escape_sequence("\x1b[33m"), "⑂", raw_escape_sequence("\x1b[0m"))),
    if(hidden, concat(raw_escape_sequence("\x1b[90m"), "∅", raw_escape_sequence("\x1b[0m"))),
  )
'
'''
when = "jj --ignore-working-copy root 2>/dev/null"
format = "$output"

[status]
disabled = false

[direnv]
disabled = false

[hostname]
format = "[@$hostname]($style) "

[haskell]
format = '\[[$symbol($version)]($style)\] '
